{% extends "base.html" %}

{% block title %}Dizi Kutusu{% endblock %}

{% block head_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
{% endblock %}

{% block body %}
  <header>
    <h1>🎬 Dizi Kutusu</h1>
    <nav class="header-nav">
      <a href="{{ url_for('main.friends') }}">Arkadaşlar</a>
      <a href="{{ url_for('main.profile') }}">Profil</a>
      <a href="{{ url_for('main.settings') }}">Ayarlar</a>
      <span class="user-email">{{ session["user"] }}</span>
      <a href="{{ url_for('auth.logout') }}" class="logout-link">Çıkış</a>
    </nav>
  </header>

  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Dizi ara..." />
    <select id="genreFilter">
      <option value="">Tüm Türler</option>
    </select>
    <button class="btn-toggle-filters" id="btnFilters">Filtreler ▾</button>
  </div>

  <div class="advanced-filters" id="advancedFilters" style="display:none;">
    <div class="filter-group">
      <label>Yıl</label>
      <input type="number" id="filterYear" placeholder="Ör: 2024" min="1900" max="2100">
    </div>
    <div class="filter-group">
      <label>Min Puan</label>
      <input type="number" id="filterMinRating" placeholder="0" min="0" max="10" step="0.1">
    </div>
    <div class="filter-group">
      <label>Max Puan</label>
      <input type="number" id="filterMaxRating" placeholder="10" min="0" max="10" step="0.1">
    </div>
    <div class="filter-group">
      <label>Durum</label>
      <select id="filterStatus">
        <option value="">Tümü</option>
        <option value="Running">Devam Ediyor</option>
        <option value="Ended">Bitti</option>
        <option value="To Be Determined">Belirsiz</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Sıralama</label>
      <select id="filterSort">
        <option value="">Varsayılan</option>
        <option value="rating_desc">Puan (Yüksek→Düşük)</option>
        <option value="rating_asc">Puan (Düşük→Yüksek)</option>
        <option value="year_desc">Yıl (Yeni→Eski)</option>
        <option value="year_asc">Yıl (Eski→Yeni)</option>
        <option value="title_asc">Başlık (A→Z)</option>
        <option value="title_desc">Başlık (Z→A)</option>
      </select>
    </div>
    <button class="btn-clear-filters" id="btnClearFilters">Temizle</button>
  </div>

  <div id="loading">Diziler yükleniyor...</div>
  <div class="grid" id="grid"></div>
  <div class="pagination" id="pagination"></div>
{% endblock %}

{% block scripts %}
  <script>
    function esc(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    const PER_PAGE = 20;
    let currentPage = 1;
    let totalItems = 0;
    let searchTimer = null;

    fetch("/api/series")
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(data => {
        const list = Array.isArray(data) ? data : (data.items || []);
        populateGenres(list);
      })
      .catch(() => {});

    loadPage(1);

    function getFilters() {
      return {
        q: document.getElementById("searchInput").value.trim(),
        genre: document.getElementById("genreFilter").value,
        year: document.getElementById("filterYear").value.trim(),
        min_rating: document.getElementById("filterMinRating").value.trim(),
        max_rating: document.getElementById("filterMaxRating").value.trim(),
        status: document.getElementById("filterStatus").value,
        sort_by: document.getElementById("filterSort").value
      };
    }

    function hasActiveFilters(f) {
      return f.q || f.genre || f.year || f.min_rating || f.max_rating || f.status || f.sort_by;
    }

    function buildUrl(page) {
      const f = getFilters();
      if (hasActiveFilters(f)) {
        const params = new URLSearchParams();
        if (f.q) params.set("q", f.q);
        if (f.genre) params.set("genre", f.genre);
        if (f.year) params.set("year", f.year);
        if (f.min_rating) params.set("min_rating", f.min_rating);
        if (f.max_rating) params.set("max_rating", f.max_rating);
        if (f.status) params.set("status", f.status);
        if (f.sort_by) params.set("sort_by", f.sort_by);
        params.set("page", page);
        params.set("per_page", PER_PAGE);
        return "/api/series/search?" + params.toString();
      }
      return `/api/series/?page=${page}&per_page=${PER_PAGE}`;
    }

    function loadPage(page) {
      document.getElementById("loading").style.display = "block";
      document.getElementById("grid").innerHTML = "";
      document.getElementById("pagination").innerHTML = "";

      fetch(buildUrl(page))
        .then(r => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then(data => {
          document.getElementById("loading").style.display = "none";
          const items = Array.isArray(data) ? data : (data.items || []);
          totalItems = data.total != null ? data.total : items.length;
          currentPage = data.page || page;

          if (!items.length) {
            document.getElementById("grid").innerHTML = '<p class="no-results">Sonuç bulunamadı.</p>';
            return;
          }

          renderCards(items);
          renderPagination();
        })
        .catch(() => {
          document.getElementById("loading").style.display = "none";
          document.getElementById("grid").innerHTML = '<p id="load-error">Diziler yüklenirken bir hata oluştu.</p>';
        });
    }

    function populateGenres(list) {
      const genres = [...new Set(list.map(s => s.genre).filter(Boolean))].sort();
      const sel = document.getElementById("genreFilter");
      genres.forEach(g => {
        const opt = document.createElement("option");
        opt.value = g;
        opt.textContent = g;
        sel.appendChild(opt);
      });
    }

    function renderCards(list) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      list.forEach(s => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => { window.location.href = `/series/${s.id}`; };
        card.innerHTML = `
          ${s.image_url
            ? `<img src="${esc(s.image_url)}" alt="${esc(s.title)}" />`
            : `<div class="no-img">Görsel yok</div>`}
          <div class="info">
            <h3 title="${esc(s.title)}">${esc(s.title)}</h3>
            <span>${esc(String(s.release_year || "?"))} · ${esc(s.genre || "")}</span>
            ${s.rating ? `<span class="rating"> ⭐ ${esc(String(s.rating))}</span>` : ""}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderPagination() {
      const totalPages = Math.ceil(totalItems / PER_PAGE);
      if (totalPages <= 1) return;

      const pag = document.getElementById("pagination");
      pag.innerHTML = "";

      const prev = document.createElement("button");
      prev.className = "page-btn";
      prev.textContent = "←";
      prev.disabled = currentPage <= 1;
      prev.onclick = () => loadPage(currentPage - 1);
      pag.appendChild(prev);

      const start = Math.max(1, currentPage - 2);
      const end = Math.min(totalPages, currentPage + 2);

      if (start > 1) {
        pag.appendChild(makePageBtn(1));
        if (start > 2) {
          const dots = document.createElement("span");
          dots.className = "page-dots";
          dots.textContent = "...";
          pag.appendChild(dots);
        }
      }

      for (let i = start; i <= end; i++) {
        pag.appendChild(makePageBtn(i));
      }

      if (end < totalPages) {
        if (end < totalPages - 1) {
          const dots = document.createElement("span");
          dots.className = "page-dots";
          dots.textContent = "...";
          pag.appendChild(dots);
        }
        pag.appendChild(makePageBtn(totalPages));
      }

      const next = document.createElement("button");
      next.className = "page-btn";
      next.textContent = "→";
      next.disabled = currentPage >= totalPages;
      next.onclick = () => loadPage(currentPage + 1);
      pag.appendChild(next);
    }

    function makePageBtn(page) {
      const btn = document.createElement("button");
      btn.className = "page-btn" + (page === currentPage ? " active" : "");
      btn.textContent = page;
      btn.onclick = () => loadPage(page);
      return btn;
    }

    document.getElementById("searchInput").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadPage(1), 350);
    });

    document.getElementById("genreFilter").addEventListener("change", () => loadPage(1));

    document.getElementById("btnFilters").addEventListener("click", () => {
      const panel = document.getElementById("advancedFilters");
      const btn = document.getElementById("btnFilters");
      const open = panel.style.display === "none";
      panel.style.display = open ? "flex" : "none";
      btn.textContent = open ? "Filtreler ▴" : "Filtreler ▾";
    });

    ["filterYear", "filterMinRating", "filterMaxRating"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => loadPage(1));
    });

    ["filterStatus", "filterSort"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => loadPage(1));
    });

    document.getElementById("btnClearFilters").addEventListener("click", () => {
      document.getElementById("filterYear").value = "";
      document.getElementById("filterMinRating").value = "";
      document.getElementById("filterMaxRating").value = "";
      document.getElementById("filterStatus").value = "";
      document.getElementById("filterSort").value = "";
      loadPage(1);
    });
  </script>
{% endblock %}
