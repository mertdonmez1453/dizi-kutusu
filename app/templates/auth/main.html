{% extends "base.html" %}

{% block title %}Dizi Kutusu{% endblock %}

{% block head_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
{% endblock %}

{% block body %}
  <header>
    <h1>🎬 Dizi Kutusu</h1>
    <div>
      <span class="user-email">{{ session["user"] }}</span>
      <a href="{{ url_for('auth.logout') }}">Çıkış</a>
    </div>
  </header>

  <div class="search">
    <input type="text" id="searchInput" placeholder="Dizi ara..." />
  </div>

  <div id="loading">Diziler yükleniyor...</div>
  <div class="grid" id="grid"></div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <span class="close" id="closeModal">&times;</span>
      <img id="modalImg" src="" alt="" />
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
      <div class="meta">
        <span id="modalMeta"></span>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script>
    function esc(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    let allSeries = [];

    fetch("/api/series")
      .then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(data => {
        allSeries = data;
        document.getElementById("loading").style.display = "none";
        renderCards(allSeries);
      })
      .catch(() => {
        document.getElementById("loading").style.display = "none";
        const el = document.createElement("div");
        el.id = "load-error";
        el.textContent = "Diziler yüklenirken bir hata oluştu.";
        document.getElementById("grid").before(el);
      });

    function renderCards(list) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      list.forEach(s => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => showDetail(s);
        card.innerHTML = `
          ${s.image_url
            ? `<img src="${esc(s.image_url)}" alt="${esc(s.title)}" />`
            : `<div class="no-img">Görsel yok</div>`}
          <div class="info">
            <h3 title="${esc(s.title)}">${esc(s.title)}</h3>
            <span>${esc(String(s.release_year || "?"))} · ${esc(s.genre || "")}</span>
            ${s.rating ? `<span class="rating"> ⭐ ${esc(String(s.rating))}</span>` : ""}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById("searchInput").addEventListener("input", e => {
      const q = e.target.value.toLowerCase();
      renderCards(allSeries.filter(s => s.title.toLowerCase().includes(q)));
    });

    function showDetail(s) {
      document.getElementById("modalImg").src = s.image_url || "";
      document.getElementById("modalImg").style.display = s.image_url ? "block" : "none";
      document.getElementById("modalTitle").textContent = s.title;
      document.getElementById("modalDesc").textContent = s.description || "Açıklama yok.";
      document.getElementById("modalMeta").textContent =
        `${s.release_year || "?"} · ${s.genre || "Bilinmiyor"} · ${s.status || ""} · Puan: ${s.rating || "-"}`;
      document.getElementById("overlay").classList.add("active");
    }

    document.getElementById("closeModal").onclick = () => {
      document.getElementById("overlay").classList.remove("active");
    };
    document.getElementById("overlay").onclick = (e) => {
      if (e.target === document.getElementById("overlay")) {
        document.getElementById("overlay").classList.remove("active");
      }
    };
  </script>
{% endblock %}
