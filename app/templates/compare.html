{% extends "base.html" %}

{% block title %}Dizi Karşılaştır — Dizi Kutusu{% endblock %}

{% block head_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/compare.css') }}">
{% endblock %}

{% block body %}
  <div class="compare-page">
    <div class="compare-header">
      <a href="{{ url_for('main.index') }}" class="back-link">←</a>
      <h2>Dizi Karşılaştır</h2>
    </div>

    <!-- Dizi ekleme alanı -->
    <div class="picker-section">
      <div class="picker-search">
        <input type="text" id="pickerInput" placeholder="Dizi ara ve ekle (2-5 adet)..." />
        <div class="picker-results" id="pickerResults"></div>
      </div>
      <div class="picked-list" id="pickedList">
        <p class="picked-hint" id="pickedHint">Karşılaştırmak için en az 2 dizi seç.</p>
      </div>
      <button class="btn-compare" id="btnCompare" disabled>Karşılaştır</button>
    </div>

    <!-- Sonuç tablosu -->
    <div class="compare-result" id="compareResult" style="display:none;">
      <div class="compare-table-wrap">
        <table class="compare-table" id="compareTable"></table>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script>
    function esc(str) {
      if (!str && str !== 0) return "";
      const d = document.createElement("div");
      d.textContent = String(str);
      return d.innerHTML;
    }

    const MAX_PICK = 5;
    let picked = [];
    let searchTimer = null;

    const pickerInput = document.getElementById("pickerInput");
    const pickerResults = document.getElementById("pickerResults");
    const pickedList = document.getElementById("pickedList");
    const pickedHint = document.getElementById("pickedHint");
    const btnCompare = document.getElementById("btnCompare");

    /* ── Dizi arama ── */
    pickerInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      const q = pickerInput.value.trim();
      if (!q) { pickerResults.style.display = "none"; return; }

      searchTimer = setTimeout(() => {
        fetch(`/api/series/search?q=${encodeURIComponent(q)}&per_page=8`)
          .then(r => { if (!r.ok) throw new Error(); return r.json(); })
          .then(data => {
            const items = Array.isArray(data) ? data : (data.items || []);
            pickerResults.innerHTML = "";
            if (!items.length) {
              pickerResults.innerHTML = '<div class="picker-empty">Sonuç bulunamadı.</div>';
              pickerResults.style.display = "block";
              return;
            }
            items.forEach(s => {
              const already = picked.some(p => p.id === s.id);
              const item = document.createElement("div");
              item.className = "picker-item" + (already ? " disabled" : "");
              item.innerHTML = `
                <span>${esc(s.title)}</span>
                <span class="picker-item-meta">${esc(String(s.release_year || ""))} · ${esc(s.genre || "")}</span>
              `;
              if (!already && picked.length < MAX_PICK) {
                item.addEventListener("click", () => addPick(s));
              }
              pickerResults.appendChild(item);
            });
            pickerResults.style.display = "block";
          })
          .catch(() => {});
      }, 300);
    });

    document.addEventListener("click", e => {
      if (!pickerInput.contains(e.target) && !pickerResults.contains(e.target)) {
        pickerResults.style.display = "none";
      }
    });

    /* ── Seçim yönetimi ── */
    function addPick(s) {
      if (picked.length >= MAX_PICK || picked.some(p => p.id === s.id)) return;
      picked.push({ id: s.id, title: s.title, year: s.release_year, genre: s.genre, image_url: s.image_url });
      pickerInput.value = "";
      pickerResults.style.display = "none";
      renderPicked();
    }

    function removePick(id) {
      picked = picked.filter(p => p.id !== id);
      renderPicked();
    }

    function renderPicked() {
      pickedHint.style.display = picked.length ? "none" : "block";
      btnCompare.disabled = picked.length < 2;

      const tags = pickedList.querySelectorAll(".picked-tag");
      tags.forEach(t => t.remove());

      picked.forEach(p => {
        const tag = document.createElement("div");
        tag.className = "picked-tag";
        tag.innerHTML = `
          <span>${esc(p.title)}</span>
          <button class="picked-remove" title="Kaldır">&times;</button>
        `;
        tag.querySelector(".picked-remove").addEventListener("click", () => removePick(p.id));
        pickedList.insertBefore(tag, pickedHint);
      });

      if (picked.length >= MAX_PICK) {
        pickerInput.placeholder = "Maksimum 5 dizi seçildi";
        pickerInput.disabled = true;
      } else {
        pickerInput.placeholder = `Dizi ara ve ekle (${picked.length}/5)...`;
        pickerInput.disabled = false;
      }
    }

    /* ── Karşılaştır ── */
    btnCompare.addEventListener("click", () => {
      if (picked.length < 2) return;
      const ids = picked.map(p => p.id).join(",");
      btnCompare.disabled = true;
      btnCompare.textContent = "Yükleniyor...";

      fetch(`/api/series/compare?ids=${ids}`)
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(data => {
          const items = Array.isArray(data) ? data : (data.items || data.series || []);
          renderCompareTable(items);
          document.getElementById("compareResult").style.display = "block";
          document.getElementById("compareResult").scrollIntoView({ behavior: "smooth" });
        })
        .catch(() => {
          document.getElementById("compareResult").style.display = "block";
          document.getElementById("compareTable").innerHTML =
            '<tr><td class="compare-error">Karşılaştırma verileri yüklenemedi.</td></tr>';
        })
        .finally(() => {
          btnCompare.disabled = false;
          btnCompare.textContent = "Karşılaştır";
        });
    });

    /* ── Tablo render ── */
    function renderCompareTable(items) {
      const table = document.getElementById("compareTable");
      table.innerHTML = "";

      const rows = [
        { label: "",           fn: s => s.image_url
            ? `<img src="${esc(s.image_url)}" class="cmp-poster" alt="${esc(s.title)}" />`
            : `<div class="cmp-no-img">Görsel yok</div>` },
        { label: "Dizi",       fn: s => `<a href="/series/${s.id}" class="cmp-link">${esc(s.title)}</a>` },
        { label: "Yıl",        fn: s => esc(s.release_year ?? "—") },
        { label: "Tür",        fn: s => esc(s.genre ?? "—") },
        { label: "Durum",      fn: s => esc(s.status ?? "—") },
        { label: "Sezon",      fn: s => esc(s.number_of_seasons ?? "—") },
        { label: "Bölüm",      fn: s => esc(s.number_of_episodes ?? "—") },
        { label: "Puan",       fn: s => s.rating != null ? `<span class="cmp-rating">⭐ ${Number(s.rating).toFixed(1)}</span>` : "—" },
        { label: "Ort. Puan",  fn: s => s.average_rating != null ? Number(s.average_rating).toFixed(1) : "—" },
        { label: "İzleyici",   fn: s => esc(s.watcher_count ?? s.total_watchers ?? "—") },
        { label: "Favori",     fn: s => esc(s.favorite_count ?? "—") },
        { label: "Yorum",      fn: s => esc(s.review_count ?? s.comment_count ?? "—") },
      ];

      rows.forEach(row => {
        const tr = document.createElement("tr");
        if (row.label) {
          const th = document.createElement("th");
          th.textContent = row.label;
          tr.appendChild(th);
        } else {
          tr.appendChild(document.createElement("th"));
        }
        items.forEach(s => {
          const td = document.createElement("td");
          td.innerHTML = row.fn(s);
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });

      highlightBest(table, items);
    }

    function highlightBest(table, items) {
      const numericRows = {
        "Puan": s => s.rating,
        "Ort. Puan": s => s.average_rating,
        "İzleyici": s => s.watcher_count ?? s.total_watchers,
        "Favori": s => s.favorite_count,
        "Yorum": s => s.review_count ?? s.comment_count
      };

      table.querySelectorAll("tr").forEach(tr => {
        const th = tr.querySelector("th");
        if (!th || !numericRows[th.textContent]) return;

        const getter = numericRows[th.textContent];
        const tds = Array.from(tr.querySelectorAll("td"));
        let maxVal = -Infinity;
        let maxIdx = -1;

        items.forEach((s, i) => {
          const v = Number(getter(s));
          if (!isNaN(v) && v > maxVal) { maxVal = v; maxIdx = i; }
        });

        if (maxIdx >= 0 && maxVal > 0) {
          tds[maxIdx].classList.add("cmp-best");
        }
      });
    }
  </script>
{% endblock %}
