{% extends "base.html" %}

{% block title %}Arkadaş Aktiviteleri — Dizi Kutusu{% endblock %}

{% block head_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/feed.css') }}">
{% endblock %}

{% block body %}
  <header>
    <h1><a href="{{ url_for('main.index') }}" class="back-link">← Dizi Kutusu</a></h1>
    <nav class="header-nav">
      <span class="user-email">{{ session["user"] }}</span>
      <a href="{{ url_for('auth.logout') }}" class="logout-link">Çıkış</a>
    </nav>
  </header>

  <div class="feed-page">
    <h2>Arkadaş Aktiviteleri</h2>
    <div id="feedLoading" class="feed-loading">Yükleniyor...</div>
    <div class="feed-list" id="feedList"></div>
  </div>
{% endblock %}

{% block scripts %}
  <script>
    function esc(str) {
      if (!str && str !== 0) return "";
      const d = document.createElement("div");
      d.textContent = String(str);
      return d.innerHTML;
    }

    const ACTION_MAP = {
      rated: "puan verdi",
      reviewed: "yorum yaptı",
      commented: "yorum yaptı",
      added_to_watchlist: "listeye ekledi",
      watchlist_add: "listeye ekledi",
      favorited: "favorilere ekledi",
      favorite_add: "favorilere ekledi",
      status_update: "durumunu güncelledi"
    };

    fetch("/api/friendships/feed")
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(data => {
        document.getElementById("feedLoading").style.display = "none";
        const items = Array.isArray(data) ? data : (data.items || []);
        const list = document.getElementById("feedList");

        if (!items.length) {
          list.innerHTML = '<p class="feed-empty">Henüz arkadaş aktivitesi yok. Birilerini takip etmeyi dene!</p>';
          return;
        }

        items.forEach(a => {
          const card = document.createElement("div");
          card.className = "feed-card";

          const username = a.username || a.email || "Kullanıcı";
          const action = ACTION_MAP[a.action || a.type] || a.action || a.type || "etkileşimde bulundu";
          const seriesTitle = a.series_title || a.title || "";
          const seriesId = a.series_id;
          const dateStr = a.created_at ? new Date(a.created_at).toLocaleDateString("tr-TR") : "";

          card.innerHTML = `
            <div class="feed-card-left" ${seriesId ? `onclick="window.location.href='/series/${seriesId}'"` : ""}>
              ${a.image_url || a.series_image
                ? `<img class="feed-poster" src="${esc(a.image_url || a.series_image)}" alt="${esc(seriesTitle)}" />`
                : `<div class="feed-no-poster">🎬</div>`}
            </div>
            <div class="feed-card-body">
              <p class="feed-text">
                <strong class="feed-user" onclick="window.location.href='/friends/${a.user_id || ""}'">
                  ${esc(username)}
                </strong>
                <span class="feed-action">${esc(action)}</span>
              </p>
              <p class="feed-series" ${seriesId ? `onclick="window.location.href='/series/${seriesId}'"` : ""}>
                ${esc(seriesTitle)}
              </p>
              ${a.rating ? `<span class="feed-rating">⭐ ${a.rating}/10</span>` : ""}
              ${a.comment || a.text ? `<p class="feed-comment">${esc(a.comment || a.text)}</p>` : ""}
              <span class="feed-date">${esc(dateStr)}</span>
            </div>
          `;
          list.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById("feedLoading").style.display = "none";
        document.getElementById("feedList").innerHTML =
          '<p class="feed-empty" style="color:#e94560;">Aktiviteler yüklenemedi.</p>';
      });
  </script>
{% endblock %}
