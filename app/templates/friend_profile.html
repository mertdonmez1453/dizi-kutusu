{% extends "base.html" %}

{% block title %}Kullanıcı Profili — Dizi Kutusu{% endblock %}

{% block head_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/friends.css') }}">
{% endblock %}

{% block body %}
  <div class="friends-page">
    <div class="friends-header">
      <a href="{{ url_for('main.friends') }}" class="back-link">←</a>
      <h2>Kullanıcı Profili</h2>
    </div>

    <div id="loadingProfile"><p class="no-friends">Yükleniyor...</p></div>

    <div class="fp-content" id="fpContent" style="display:none;">
      <div class="fp-top">
        <div class="fp-avatar" id="fpAvatar"></div>
        <div class="fp-info">
          <h3 id="fpName"></h3>
          <span class="fp-email" id="fpEmail"></span>
        </div>
        <button class="btn-follow" id="fpFollowBtn">Takip Et</button>
      </div>

      <div class="fp-tabs">
        <button class="tab-btn active" data-tab="watchlist">İzleme Listesi</button>
        <button class="tab-btn" data-tab="reviews">Yorumlar</button>
      </div>

      <div id="fpTabContent">
        <div class="fp-list" id="fpList">
          <p class="no-friends">Yükleniyor...</p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script>
    const userId = {{ user_id }};

    function escapeHtml(str) {
      if (!str) return "";
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    let fpTab = "watchlist";
    let isFollowing = false;

    /* ── Profile Info ── */
    fetch(`/api/friendships/user/${userId}`)
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(data => {
        document.getElementById("loadingProfile").style.display = "none";
        document.getElementById("fpContent").style.display = "block";

        const username = data.username || data.email || "Kullanıcı";
        document.getElementById("fpAvatar").textContent = username.charAt(0).toUpperCase();
        document.getElementById("fpName").textContent = username;
        document.getElementById("fpEmail").textContent = data.email || "";
        isFollowing = !!data.is_following;
        updateFollowBtn();
        loadFPTab();
      })
      .catch(() => {
        document.getElementById("loadingProfile").innerHTML = '<p class="no-friends" style="color:#e94560;">Profil yüklenemedi.</p>';
      });

    const fpFollowBtn = document.getElementById("fpFollowBtn");
    fpFollowBtn.addEventListener("click", () => {
      const method = isFollowing ? "DELETE" : "POST";
      fetch(`/api/friendships/${userId}`, { method })
        .then(r => {
          if (!r.ok) throw new Error();
          isFollowing = !isFollowing;
          updateFollowBtn();
        })
        .catch(() => {});
    });

    function updateFollowBtn() {
      fpFollowBtn.classList.toggle("is-following", isFollowing);
      fpFollowBtn.textContent = isFollowing ? "Takipten Çık" : "Takip Et";
    }

    /* ── Tabs ── */
    document.querySelectorAll(".fp-tabs .tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".fp-tabs .tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        fpTab = btn.dataset.tab;
        loadFPTab();
      });
    });

    function loadFPTab() {
      const list = document.getElementById("fpList");
      list.innerHTML = '<p class="no-friends">Yükleniyor...</p>';

      if (fpTab === "watchlist") {
        fetch(`/api/friendships/user/${userId}/watchlist`)
          .then(r => { if (!r.ok) throw new Error(); return r.json(); })
          .then(data => {
            const items = Array.isArray(data) ? data : (data.items || []);
            if (!items.length) {
              list.innerHTML = '<p class="no-friends">İzleme listesi boş.</p>';
              return;
            }
            list.innerHTML = "";
            items.forEach(s => {
              const div = document.createElement("div");
              div.className = "fp-item";
              div.onclick = () => { window.location.href = `/series/${s.series_id || s.id}`; };

              const statusMap = {
                watching: "İzliyor",
                completed: "İzledi",
                plan_to_watch: "İzleyecek",
                dropped: "Bıraktı"
              };

              div.innerHTML = `
                <strong>${escapeHtml(s.series_title || s.title || "Dizi")}</strong>
                <span class="fp-item-meta">${statusMap[s.status] || s.status || ""}</span>
              `;
              list.appendChild(div);
            });
          })
          .catch(() => {
            list.innerHTML = '<p class="no-friends" style="color:#e94560;">Yüklenirken hata oluştu.</p>';
          });
      } else {
        fetch(`/api/friendships/user/${userId}/reviews`)
          .then(r => { if (!r.ok) throw new Error(); return r.json(); })
          .then(data => {
            const items = Array.isArray(data) ? data : (data.items || []);
            if (!items.length) {
              list.innerHTML = '<p class="no-friends">Henüz yorum yok.</p>';
              return;
            }
            list.innerHTML = "";
            items.forEach(r => {
              const div = document.createElement("div");
              div.className = "fp-item";
              div.onclick = () => { if (r.series_id) window.location.href = `/series/${r.series_id}`; };
              div.innerHTML = `
                <div class="fp-item-top">
                  <strong>${escapeHtml(r.series_title || "Dizi")}</strong>
                  ${r.rating ? `<span class="fp-item-rating">⭐ ${r.rating}/10</span>` : ""}
                </div>
                ${r.comment || r.text ? `<p class="fp-item-text">${escapeHtml(r.comment || r.text)}</p>` : ""}
              `;
              list.appendChild(div);
            });
          })
          .catch(() => {
            list.innerHTML = '<p class="no-friends" style="color:#e94560;">Yüklenirken hata oluştu.</p>';
          });
      }
    }
  </script>
{% endblock %}
