<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Dizi Kutusu{% endblock %}</title>
  {% block head_css %}{% endblock %}
  <style>
    .flash-container{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:min(480px,90vw)}
    .flash{padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;text-align:center;animation:flashIn .3s ease}
    .flash-error{background:#e94560;color:#fff}
    .flash-success{background:#00c030;color:#07210f}
    .flash-info{background:#16213e;color:#eee;border:1px solid #333}
    @keyframes flashIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-container">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
  <script>
    document.querySelectorAll('.flash').forEach(el => {
      setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, 4000);
    });

    (function() {
      const els = document.querySelectorAll('.user-email');
      if (!els.length) return;
      fetch('/api/profile')
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(data => {
          if (data.username) {
            els.forEach(el => {
              const isAdmin = el.textContent.includes('(Admin)');
              el.textContent = data.username + (isAdmin ? ' (Admin)' : '');
            });
          }
        })
        .catch(() => {});
    })();
  </script>
</body>
</html>
